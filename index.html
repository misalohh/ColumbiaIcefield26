<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColumbiaIcefield26</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
                }
			}
		</script>
  </head>
  <body>
    <div id="overlay">COLUMBIA ICEFIELD 26</div>

    <div id="warmingLabel">Level of warming</div>

    <input type="range" id="scaleSlider" min="0" max="1" step="0.01" value="0" />

    <div id="yearLabel">Projected Year</div>

    <div id="yearCounter">2026</div>

    <div id="percentRemaining">100</div>

    <div class="scenarioSlider">
        <input type="range" id="scenarioSlider" min="0" max="2" step="1" value="1" />
        <div class="scenarioLabels">
            <span>Low</span>
            <span>Medium</span>
            <span>High</span>
        </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
